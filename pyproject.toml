[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghsecret"
version = "0.1.0"
description = "Cross-Platform Security-Scanner zur Erkennung veröffentlichter Secrets in Git-Repositories."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Joscha Aaron Schmidt", email = "aaronfree00@proton.me"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
ghsecret = "ghsecret.cli:main"

[tool.setuptools.packages.find]
include = ["ghsecret*"]

[tool.pytest.ini_options]
addopts = "-q"
